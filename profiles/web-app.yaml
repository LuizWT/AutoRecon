name: web-app
label: Aplicação Web
description: Reconhecimento focado em serviços HTTP/HTTPS — títulos, certificados, vulnerabilidades web e varredura com Nikto e Nuclei.
steps:
  - tool: nmap
    mode: http_title
    label: HTTP Title (80/443)

  - tool: nmap
    mode: ssl_cert
    label: Certificado SSL (443)

  - tool: nmap
    mode: vuln
    label: Vulnerabilidades Web (nmap)

  - tool: nikto
    mode: vuln_checks
    label: Nikto — Verificações de Vulnerabilidades

  - tool: nuclei
    mode: target_spec
    label: Nuclei — Varredura Completa
